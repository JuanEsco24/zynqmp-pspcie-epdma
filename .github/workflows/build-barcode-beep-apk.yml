name: Build Barcode Beep APK

on:
  push:
    branches:
      - barcode-beep-apk-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        working-directory: BarcodeBeepDetector
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BarcodeBeepDetector-apk
          path: BarcodeBeepDetector/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
